		<style>
.accountPage > .uiSection { margin-bottom: 20px; }
.accountPage .uiSection > br { display: none; }
.accountPage .uiSection > p, .accountPage .uiSection > div:not(.uiActions) { margin-bottom: 12px; }
.accountPage form { margin: 12px 0; }
.accountPage form > fieldset { display: flex; flex-wrap: wrap; gap: 12px; align-items: end; }
.accountPage form > fieldset > label { margin: 0; }
.accountFields { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 200px), 1fr)); gap: 16px; width: 100%; min-width: 0; align-items: end; }
.accountFields > label { min-width: 0; }
.accountFields > label > div { min-height: 36px; display: flex; align-items: center; }
.accountFields input:not([type=checkbox]) { width: 100%; min-width: 0; }
.accountFieldActions { grid-column: 1 / -1; }
.accountPage input:not([type=checkbox]):not([type=radio]):not([type=file]), .accountPage textarea { max-width: 100%; }
.accountPage td { vertical-align: top; overflow-wrap: anywhere; }
.accountPage table { table-layout: fixed; }
.accountPage td input:not([type=checkbox]), .accountPage td select, .accountPage td textarea { width: 100%; }
.accountPage .uiSection > ul { margin-bottom: 16px; }
.accountPage .uiSection > h3 { margin-top: 20px; }
.accountPage button { vertical-align: middle; }
.accountPage button[style*="width: 1.5em"] { width: 32px !important; padding: 4px; }
.accountPage .rulesTable { table-layout: auto; min-width: 1150px; }
.accountPage .rulesTable td { min-width: 130px; }
.accountPage .rulesTable td:nth-last-child(1) { min-width: 120px; }
.accountPage .rulesTable input { min-width: 110px; }
.accountNav { min-height: 0; overflow-y: auto; }
@media (min-width: 761px) {
 body { height: 100dvh; display: flex; flex-direction: column; }
 .uiHeader { flex-shrink: 0; }
 .uiLayout { flex: 1; min-height: 0; }
 #page { overflow: auto; }
}
.accountNav .navGroup { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 20px 10px 5px; }
.accountIdentity { font-size: 12px; color: var(--muted); overflow-wrap: anywhere; padding: 10px; }
.autosize { display: block; }
.uiLogin .autosize { width: 100%; }
.accountDialog { width: min(900px, calc(100vw - 32px)); }
.accountDialog table { table-layout: fixed; }
.accountDialog td { overflow-wrap: anywhere; vertical-align: top; }
.accountDialog input:not([type=checkbox]), .accountDialog select, .accountDialog textarea { width: 100%; }
.accountDialog h2 { margin-top: 20px; }
.accountDialog pre { max-height: 240px; overflow: auto; }
@media (max-width: 760px) { .accountIdentity { display: none; } }

.ruleList { display: grid; gap: 16px; counter-reset: rule; }
.ruleCard { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); gap: 16px; border: 1px solid var(--control); border-radius: 8px; padding: 16px; background: var(--bg); counter-increment: rule; }
.ruleCard::before { content: "Rule " counter(rule); grid-column: 1 / -1; font-weight: 600; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
.ruleCard > div { min-width: 0; }
.ruleCard > div > span:first-child { display: block; margin-bottom: 6px; font-size: 12px; color: var(--muted); }
.ruleCard input:not([type=checkbox]) { width: 100%; }
.ruleHeaders > div { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
.ruleHeaders input { flex: 1; min-width: 90px; }

.destinationPage > #setting-profile { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 16px 24px; }
.destinationPage > #setting-profile > h2 { grid-column: 1 / -1; margin: 0; }
.destinationPage > #setting-profile input { width: 100%; }
.destinationPage > #setting-profile > div { margin: 0; }
.destinationSave { margin-top: 16px; }
@media (max-width: 760px) { .destinationPage > #setting-profile { grid-template-columns: minmax(0, 1fr); } }
