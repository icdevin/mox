		<style>
:root {
  color-scheme: light;
  --color: #282520; --muted: #625e58; --bg: #fcfaf7; --panel: #f6f3ee;
  --border: #e3ddd4; --control: #d7cfc4; --hover: #eee8df; --accent: #b94706;
  --contrast: #fff; --selected: #f6e8d9; --warning: #f8e7c5; --success: #dcebd8; --error: #f8dcd0;
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --color: #eee8df; --muted: #c4baad; --bg: #211e1a; --panel: #28241f;
  --border: #41392f; --control: #5f5243; --hover: #383026; --accent: #e99a5d;
  --contrast: #211e1a; --selected: #47301d; --warning: #503b20; --success: #293e29; --error: #552e24;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body { background: var(--bg); color: var(--color); font: 14px/1.5 -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
a { color: var(--accent); text-underline-offset: 3px; }
button, input, select, textarea { font: inherit; color: inherit; }
button, select, input, textarea { border: 1px solid var(--control); border-radius: 6px; background: var(--bg); padding: 6px 10px; max-width: 100%; }
button, select { min-height: 32px; cursor: pointer; }
input:not([type=checkbox]):not([type=radio]):not([type=hidden]), select:not([multiple]):not([size]) { height: 36px; }
.addressSeparator { display: inline-block; margin-right: 10px; }
.queueFilters { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 12px; padding: 14px; margin: 12px 0; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
.queueFilters label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
.queueFilters input, .queueFilters select { font-size: 14px; color: var(--color); }
.queueFilters input { min-width: 120px; }
.filterActions { display: flex; flex-wrap: wrap; align-items: flex-end; gap: 8px; }
.filterActions button { height: 36px; }
button:hover { background: var(--hover); }
button[type=submit] { background: var(--accent); color: var(--contrast); border-color: var(--accent); font-weight: 600; }
button:disabled, fieldset:disabled { opacity: .55; cursor: default; }
input[type=checkbox], input[type=radio] { accent-color: var(--accent); vertical-align: middle; margin: 0 4px 0 0; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
fieldset { border: 0; padding: 0; margin: 0; min-width: 0; }
label { line-height: 1.8; }
h1, h2, h3, h4 { color: var(--color); line-height: 1.3; }
h1 { font-size: 24px; letter-spacing: -.5px; margin: 0 0 20px; }
h1 a { color: var(--muted); text-decoration: none; font-weight: 400; }
h2 { font-size: 19px; margin: 24px 0 12px; }
h3, h4 { font-size: 14px; margin: 16px 0 8px; }
p { margin: 0 0 16px; max-width: 65em; }
ul { padding-left: 22px; }
li { margin: 3px 0; }
[title] { text-decoration: none; }
[title]:hover { text-decoration: underline dotted; text-underline-offset: 3px; }
button[title]:hover, a[title]:hover { text-decoration: none; }
.adminHeader { min-height: 74px; flex-wrap: wrap; display: flex; align-items: center; gap: 20px; padding: 0 24px; border-bottom: 1px solid var(--border); background: var(--panel); }
.brandName { font: bold 38px Georgia, serif; letter-spacing: -1.5px; text-decoration: none; color: var(--color); }
.adminHeader > span { color: var(--muted); border-left: 1px solid var(--control); padding-left: 20px; }
.adminHeader label { margin-left: auto; color: var(--muted); display: flex; align-items: center; gap: 8px; }
.adminHeader > a:not(.brandName) { text-decoration: none; }
.adminLayout { display: grid; grid-template-columns: 190px minmax(0, 1fr); min-height: calc(100vh - 74px); }
.adminNav { background: var(--panel); border-right: 1px solid var(--border); padding: 16px 10px; }
.adminNav a { display: block; color: var(--color); text-decoration: none; padding: 5px 10px; border-radius: 5px; margin: 1px 0; }
.adminNav a:hover { background: var(--hover); }
.adminNav a[aria-current=page] { background: var(--selected); color: var(--accent); font-weight: 600; }
.adminNav strong { display: block; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); padding: 20px 10px 5px; }
#page { min-width: 0; padding: 28px 32px; overflow-x: auto; }
#page > div { max-width: 1500px; }
#page > div > br { display: none; }
.overviewStats { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; max-width: 840px; margin: 20px 0; }
.overviewStats a { display: flex; flex-direction: column; gap: 6px; padding: 14px 18px; border: 1px solid var(--border); border-radius: 8px; text-decoration: none; background: var(--panel); }
.overviewStats a:hover { border-color: var(--accent); }
.overviewStats span { color: var(--muted); font-size: 12px; }
.overviewStats b { font-size: 26px; font-weight: 600; }
.overview > h2 { padding-top: 16px; border-top: 1px solid var(--border); }
form { margin: 12px 0; }
form > fieldset > label { margin: 0 10px 8px 0; }
table { width: 100%; border-spacing: 0; border-collapse: collapse; font-size: 13px; }
td, th { padding: 7px 10px; text-align: left; border-bottom: 1px solid var(--border); }
td.alignRight, th.alignRight { text-align: right; font-variant-numeric: tabular-nums; }
th { color: var(--muted); font-weight: 600; background: var(--panel); }
table table { width: auto; }
table table td, table table th { padding: 3px 6px; }
table.long > tbody > tr > td { padding: 10px; vertical-align: top; }
table.hover > tbody > tr:hover { background: var(--panel); }
thead { position: sticky; top: 0; z-index: 1; background: var(--panel); }
.literal, pre { background: var(--panel); padding: 12px 16px; border: 1px solid var(--border); border-radius: 6px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 ui-monospace, monospace; tab-size: 4; }
.domainLocalpartSettings { display: grid; grid-template-columns: minmax(180px, 240px) minmax(0, 1fr); gap: 16px 24px; align-items: start; padding: 16px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
.domainLocalpartSettings > label { margin: 0; }
.localpartSeparators { display: grid; gap: 10px; justify-items: start; min-width: 0; }
.localpartSeparators p { margin: 0; color: var(--muted); }
.localpartSeparatorList { display: grid; gap: 8px; }
.localpartSeparatorRow { display: flex; align-items: center; gap: 8px; }
.localpartSeparatorInput { width: 100px; min-width: 64px; }
.localpartSettingsActions { grid-column: 1 / -1; }
@media (max-width: 760px) { .domainLocalpartSettings { grid-template-columns: minmax(0, 1fr); } }
.webHandlerList { display: grid; gap: 20px; counter-reset: handler; }
.webHandlerCard { border: 1px solid var(--control); border-radius: 8px; overflow: hidden; counter-increment: handler; }
.webHandlerCard::before { content: "Handler " counter(handler); display: block; padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border); font-weight: 600; }
.webHandlerFields { padding: 16px; overflow-x: auto; }
.webHandlerFields h3 { margin: 0 0 10px; }
.webHandlerFields > table + h3 { margin-top: 20px; }
.webHandlerFields > table { width: 100%; min-width: 850px; table-layout: fixed; }
.webHandlerFields > table > tr > td, .webHandlerFields > table > tbody > tr > td { padding: 6px 10px; vertical-align: top; border: 0; }
.webHandlerFields > table > tr:first-child, .webHandlerFields > table > tbody > tr:first-child { color: var(--muted); }
.webHandlerFields input:not([type=checkbox]), .webHandlerFields select { width: 100%; }
.webHandlerMatch td:nth-child(4), .webHandlerMatch td:nth-child(5) { width: 100px; }
.webHandlerActions { border-top: 1px solid var(--border); padding: 12px 16px; background: var(--panel); }
.webHandlerActions > div, .webHandlerActions span { display: inline-flex; align-items: center; flex-wrap: wrap; gap: 8px; }
.webHandlerToolbar { display: flex; align-items: center; flex-wrap: wrap; gap: 10px; margin: 16px 0; }
.routesTableScroll { overflow-x: auto; }
.routesTable { width: 100%; min-width: 720px; table-layout: fixed; }
.routesTable th, .routesTable td { padding: 10px 12px; vertical-align: middle; }
.routesTable th:nth-child(3) { width: 145px; }
.routesTable th:nth-child(4) { width: 180px; }
.routesTable th:last-child { width: 105px; }
.routesTable input, .routesTable select { width: 100%; }
.routeActions { display: flex; align-items: center; flex-wrap: wrap; gap: 12px; margin-top: 16px; }
.domainDanger { display: flex; flex-direction: column; align-items: flex-start; gap: 12px; }
.reportDetailActions { margin-bottom: 20px; }
.tlsDNSRecord { margin-bottom: 24px; display: grid; gap: 10px; }
.tlsDNSRecord h2 { margin: 0; }
.tlsDNSRecord > div { display: grid; gap: 12px; justify-items: start; }
.tlsDNSRecord .literal { max-width: 100%; }
.tlsResultDetail { margin-top: 24px; display: grid; gap: 12px; }
.tlsResultDetail h2, .tlsResultDetail p { margin: 0; }
.loginAttemptsMore { margin-top: 16px; }
.loginAttemptsTable { table-layout: fixed; overflow-wrap: anywhere; }
.loginAttemptsTable td { vertical-align: top; }
.loginAttemptsTable .loginAttemptsCount { width: 64px; }
.loginAttemptsTable .queueInfo:first-child { margin-top: 0; }
@media (max-width: 760px) { .loginAttemptsTable th, .loginAttemptsTable td { padding: 6px 4px; } }
.queueTable { table-layout: fixed; width: 100%; }
.queueTable th, .queueTable td { vertical-align: top; overflow-wrap: anywhere; padding: 10px; }
.queueTable th:last-child { width: 85px; }
.queueSelectable th:first-child, .queueSelectable thead td:first-child { width: 34px; }
.queueInfo { margin-top: 4px; }
.queueInfoLabel { color: var(--muted); margin-right: 6px; font-size: 12px; }
.queueError { margin-top: 6px; color: var(--danger); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
@media (max-width: 600px) {
  .queueTable th, .queueTable td { padding: 6px 4px; }
  .queueTable th:last-child { width: 65px; }
  .queueTable button { padding: 6px; }
  .queueSelectable thead td:first-child { width: 26px; }
}
.text { max-width: 65em; }
.twocols { display: flex; flex-wrap: wrap; gap: 24px; }
.twocols > * { min-width: 0; }
.unclutter { opacity: .65; }
.unclutter:hover, .unclutter:focus-within { opacity: 1; }
.adminFooter { margin-top: 32px; padding-top: 12px; border-top: 1px solid var(--border); font-size: 12px; color: var(--muted); }
.adminOverlay { position: fixed; inset: 0; background: #28252055; display: flex; align-items: center; justify-content: center; z-index: 10; padding: 16px; }
.adminDialog { background: var(--bg); border: 1px solid var(--border); border-radius: 10px; padding: 24px; box-shadow: 0 12px 36px #0002; max-width: 95vw; max-height: 95vh; overflow: auto; }
.adminDialog.detailsDialog { width: 1100px; height: min(760px, calc(100dvh - 32px)); max-width: calc(100vw - 32px); max-height: none; display: flex; flex-direction: column; gap: 16px; overflow: hidden; }
.detailsDialogHeader { display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-shrink: 0; }
.detailsDialogHeader h1 { margin: 0; }
.detailsSummary { flex-shrink: 0; max-height: 100px; overflow: auto; overflow-wrap: anywhere; color: var(--muted); }
.detailsSummary b { color: var(--color); margin-right: 6px; }
.detailsSections { min-height: 0; flex: 1; display: grid; grid-template-rows: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; }
.detailsSection { min-width: 0; min-height: 0; display: flex; flex-direction: column; }
.detailsSection h2 { margin: 0 0 8px; font-size: 14px; flex-shrink: 0; }
.detailsResults, .detailsPayload { min-height: 0; overflow: auto; flex: 1; border: 1px solid var(--border); border-radius: 6px; }
.detailsResults table { width: 100%; min-width: 900px; table-layout: fixed; }
.detailsResults td { vertical-align: top; overflow-wrap: anywhere; }
.detailsResults th:nth-child(-n+4) { width: 90px; }
.detailsResults > p { padding: 16px; color: var(--muted); }
.detailsPayload { margin: 0; white-space: pre-wrap; }
@media (max-width: 760px) { .adminDialog.detailsDialog { padding: 16px; gap: 12px; } }
 .adminDialog.mailDialog { width: 900px; height: min(520px, calc(100dvh - 32px)); }
.mailDialog .detailsSections { grid-template-rows: minmax(0, 1fr); }
.mailDialog .detailsResults table { min-width: 700px; }
.mailDialog .detailsResults th:nth-child(5) { width: 110px; }
:root { --danger: #a52b27; --dangerBackground: #fce9e6; --dangerBorder: #d8a5a0; }
:root[data-theme="dark"] { --danger: #f2a099; --dangerBackground: #472a26; --dangerBorder: #90544d; }
button.dangerButton { color: var(--danger); border-color: var(--dangerBorder); background: transparent; }
button.dangerButton:hover:not(:disabled) { background: var(--dangerBackground); border-color: var(--danger); }
button.dangerButton:focus-visible { outline-color: var(--danger); }
.accountRemove { margin-top: 28px; }
.accountAliases { width: 100%; }
.accountSettings { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 20px 24px; padding: 20px; border: 1px solid var(--border); border-radius: 8px; background: var(--panel); }
form > .accountSettings > label { margin: 0; }
.accountSettings > label > input { display: block; width: 100%; margin-top: 6px; }
.accountSettings > label > br { display: none; }
.accountSettings > div:not(.settingsActions) { grid-column: span 1; }
.accountSettings .settingsActions { grid-column: 1 / -1; }
@media (max-width: 1000px) { .accountSettings { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 600px) { .accountSettings { grid-template-columns: minmax(0, 1fr); padding: 16px; } }
.adminLogin { background: var(--panel); }
.adminLogin .adminDialog { width: 340px; }
.adminLogin input { width: 100%; }
.adminLogin h1 { font: bold 38px Georgia, serif; }
.adminLogin button { width: 100%; }
.loginNotice { margin: 0 0 20px; padding: 12px 14px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); font-size: 13px; line-height: 1.5; overflow-wrap: anywhere; }
.loginNoticeTitle { display: block; margin-bottom: 4px; font-weight: 600; }
.loginNotice > div:not(.loginNoticeTitle) { color: var(--muted); }
#page, .loadend { opacity: 1; }
#page.loading, .loadstart { opacity: .35; transition: opacity .15s; }
@media (max-width: 760px) {
  .adminHeader { padding: 12px 16px; gap: 12px; }
  .adminHeader > span { display: none; }
  .adminHeader label { font-size: 12px; }
  .adminLayout { display: block; }
  .adminNav { display: flex; gap: 4px; overflow-x: auto; border-right: 0; border-bottom: 1px solid var(--border); padding: 8px; }
  .adminNav strong { display: none; }
  .adminNav a { white-space: nowrap; }
  #page { padding: 20px 16px; }
  h1 { font-size: 20px; }
}
@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }

/* Keeping the caret inset while preserving native dropdown behavior. */
select:not([multiple]):not([size]), select:not([multiple])[size="1"] {
  appearance: none;
  padding-right: 32px;
  background-image: linear-gradient(45deg, transparent 50%, currentColor 50%), linear-gradient(135deg, currentColor 50%, transparent 50%);
  background-position: calc(100% - 14px) 50%, calc(100% - 10px) 50%;
  background-size: 4px 4px;
  background-repeat: no-repeat;
}
@media (forced-colors: active) {
  select:not([multiple]):not([size]), select:not([multiple])[size="1"] { appearance: auto; background-image: none; }
}
